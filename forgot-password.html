<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | SwiftCart</title>
    <link rel="stylesheet" href="assets/css/forgot-password.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="right-side">
                <div class="logo"><i class="ti ti-garden-cart"></i> SwiftCart</div>
                 <div class="header">   
                    <h2 class="main-text">Forgot Password</h2>
                    <span class="supporting-text">Recover password via email</span>
                 </div> 
                 <div class="login-form">
                        <div class="form">
                            <label class="password-label">Enter your email</label>
                            <input type="email" placeholder="e.g Juan@gmail.com" id="passwordInput" autocomplete="off">
                        </div>
                 </div>
                 <div class="login-submit" id="submitSignUp">
                    <span id="submit">Send Code</span>
                 </div>
                 <div class="footer">
                    <span>Already have an account?</span>
                    <a href="login.html" class="sign-up">Sign In</a>
                 </div> 
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SwiftCart</title>
    <link rel="stylesheet" href="/assets/css/reset-password.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="back-arrow"><i class="ti ti-arrow-narrow-left"></i></div>
            <div class="reset-password">
                <div class="logo"><i class="ti ti-garden-cart"></i> SwiftCart</div>
                <div class="header">
                    <h2 class="main-text">Set a new password</h2>
                    <span class="supporting-text">Choose a strong password you haven't used before</span>
                </div>
                <div class="login-form">
                    <div class="form">
                        <label class="password-label">New password</label>
                        <input type="password" placeholder="••••••••••" id="newPasswordInput" autocomplete="off">
                    </div>
                    <div class="form">
                        <label class="password-label">Confirm password</label>
                        <input type="password" placeholder="••••••••••" id="confirmPasswordInput" autocomplete="off">
                    </div>
                </div>
                <div class="reset-submit" onclick="resetPassword()" id="reset-submit-container">
                    <span id="reset-btn">Reset password</span>
                </div>
                <div class="footer">
                    <span>Remembered it after all?</span>
                    <a href="login.html" class="sign-up">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/script/reset-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp | SwiftCart</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <div class="content">
            <div class="right-side">
                <div class="logo"><i class="ti ti-garden-cart"></i> SwiftCart</div>
                 <div class="header">   
                    <h2 class="main-text">Create Account</h2>
                    <span class="supporting-text">Join SwiftCart and start shopping today</span>
                 </div>
                 <div class="login-form">
                        <div class="form">
                            <label>Username*</label>
                            <input type="text" placeholder="e.g juandelacruz" id="usernameInput">
                        </div>
                        <div class="form">
                            <div class="email-container">
                                <label class="email-label">Email Address*</label>
                            </div>
                            <input type="email" placeholder="e.g Juan@gmail.com" id="emailInput" autocomplete="new-password">
                        </div>
                        <div class="form">
                            <label class="password-label">Password*</label>
                            <input type="password" placeholder="••••••••••" id="passwordInput" autocomplete="new-password">
                        </div>
                 </div>
                 <div class="login-submit" id="submitSignUp">
                    <span id="submit">Sign Up</span>
                 </div>
                 <div class="divider-side">
                    <span class="divider"></span>
                    <span class="user-choice">Or Sign Up With</span>
                    <span class="divider"></span>
                 </div>
                 <div class="login-platform">
                    <div class="btn" onclick="window.location.href='http://localhost:8080/oauth2/authorization/google'">
                        <div class="platform-logo"><i class="bi bi-google"></i></div>
                        <div>Google</div>
                    </div>
                    <div class="btn">
                        <div class="platform-logo"><i class="bi bi-facebook"></i></div>
                        <div>Facebook</div>
                    </div>
                 </div>
                 <div class="footer">
                    <span>Already have an account?</span>
                    <a href="login.html" class="sign-up">Sign In</a>
                 </div> 
            </div>
            <div class="left-side">
                 <img src="/assets/images/Catalogue-amico.svg" alt="Swift Login Image"> 
            </div>
        </div>
    </div>
   <script src="/script/login.js" defer></script>
</body>
</html>

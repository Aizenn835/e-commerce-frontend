<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Information</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/shipping-information.css">
</head>
<body>
    <nav class="header">
        <div class="logo"><i class="ti ti-garden-cart"></i> SwiftCart</div>
    </nav>
    <section class="hero">
        <div class="back-arrow" id="back" onclick="window.location.href='/pages/home.html'">
            <span><i class="ti ti-arrow-narrow-left"></i> Back to store</span>
        </div>
      <div class="shipping-body">
        <div class="shipping-method">
            <h3>Shipping Method</h3>
            <div class="shipping-choices">
                <div class="container shipping-option selected" data-shipping-fee="standard shipping">
                    <div class="contain">
                        <div class="shipping-input">
                          <input type="radio" name="Shipping" checked >
                        </div>
                        <div class="shipping-container">
                            <p class="info">Standard Shipping</p>
                            <span class="supporting-info">5-7 business days</span>
                        </div>
                    </div>
                    <div>
                        <span class="shipping-payment" style="color:green;">Free</span>
                    </div>
                </div>
                <div class="container shipping-option" data-shipping-fee="express shipping">
                    <div class="contain">
                        <div class="shipping-input">
                          <input type="radio" name="Shipping">
                        </div>
                        <div class="shipping-container">
                            <p class="info">Express Shipping</p>
                            <span class="supporting-info">2-3 business days</span>
                        </div>
                    </div>
                    <div>
                        <span class="shipping-payment">₱12.95</span>
                    </div>
                </div>
                <div class="container shipping-option" data-shipping-fee="priority overnight">
                    <div class="contain">
                        <div class="shipping-input">
                          <input type="radio" name="Shipping" >
                        </div>
                        <div class="shipping-container">
                            <p class="info">Priority Overnight</p>
                            <span class="supporting-info">Next business days</span>
                        </div>
                    </div>
                    <div>
                        <span class="shipping-payment">₱24.95</span>
                    </div>
                </div>
            </div>
            <div class="shipping-btn">
                <div class="back-btn">
                    <span>Back</span>
                </div>
                 <div class="continue-btn" onclick="continuePayment()">
                    <span class="continue-text">Continue to Payment</span>
                </div>
            </div>
        </div>

        <div class="order-summary">
            <div class="order-container">
                <span id="order-header">Order Summary</span>
                <div class="order-field">
                   <!-- Order data goes here -->
                </div>
                <div class="total-summary">
                        <div class="total-container">
                            <div class="total-text">Subtotal</div>
                            <div class="total-payment" id="subtotal">--</div> 
                        </div>
                        <div class="total-container">
                            <div class="total-text">Shipping</div>
                            <div class="total-payment" id="shipping-value">--</div> 
                        </div>
                        <div class="total-container">
                            <div class="total-text">Tax (8%)</div>
                            <div class="total-payment" id="tax-value">--</div> 
                        </div>
                </div>
                <div class="total-price">
                    <div><span style="font-weight: 600;">Total</span></div>
                    <div style="font-weight: 600; font-size:0.925rem;" id="total-value">--</div>
                </div>

                <!-- This is here because renderCartPayment.js needs it! -->
                <div id="info-total" style="display: none;">--</div>
                <b id="order-total" style="display: none;">--</b>
            </div>
        </div>
      </div> 
    </section>


    <script src="/script/payment-settings/renderCartPayment-information.js"></script>
    <script src="/script/payment-settings/shipping-infomation.js"></script>
   

</body>
</html>
